<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BinWise | Robobin settings</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- defer makes the JavaScript run after the page has loaded -->
  <script src="js/script.js" defer></script>
</head>
<body data-page="settings">
  <header>
    <div class="top-bar">
      <h1>BinWise</h1>
      <p class="user-bar"><span id="userName"></span> <button type="button" id="logout" class="secondary">Log out</button></p>
    </div>
  </header>

  <!-- Menu on the left, page content on the right -->
  <div class="layout">
    <nav><a href="index.html" id="nav-dashboard">Dashboard</a><a href="report.html" id="nav-report">Fly-Tech report</a><a href="support.html" id="nav-support">Support</a><a href="drop.html" id="nav-simulator">Robobin simulator</a><a href="settings.html" id="nav-settings" class="active">Settings</a></nav>

  <main class="narrow">
    <section>
      <h2>Calibration</h2>
      <form id="settingsForm" novalidate>
        <div class="form-group">
          <label for="sort_threshold">Certainty needed to sort an item (0.50 to 0.99)</label>
          <input type="number" id="sort_threshold" min="0.5" max="0.99" step="0.01">
          <span class="error-message">Enter a number from 0.50 to 0.99.</span>
        </div>
        <div class="form-group">
          <label for="hazard_threshold">Certainty to treat a battery or vape as hazardous (0.10 to 0.99)</label>
          <input type="number" id="hazard_threshold" min="0.1" max="0.99" step="0.01">
          <span class="error-message">Enter a number from 0.10 to 0.99.</span>
        </div>
        <div class="form-group">
          <label for="sensor_confirm">Certainty added when the sensor confirms the material (0.00 to 0.50)</label>
          <input type="number" id="sensor_confirm" min="0" max="0.5" step="0.01">
          <span class="error-message">Enter a number from 0.00 to 0.50.</span>
        </div>
        <div class="form-group">
          <label for="sensor_disagree">Certainty taken away when the sensor disagrees (0.00 to 0.50)</label>
          <input type="number" id="sensor_disagree" min="0" max="0.5" step="0.01">
          <span class="error-message">Enter a number from 0.00 to 0.50.</span>
        </div>
        <button type="submit">Save settings</button>
      </form>
      <p id="result" class="note"></p>
    </section>
  </main>
  </div>
</body>
</html>
