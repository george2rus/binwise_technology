<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BinWise | Support</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- defer makes the JavaScript run after the page has loaded -->
  <script src="js/script.js" defer></script>
</head>
<body data-page="support">
  <header>
    <div class="top-bar">
      <h1>BinWise</h1>
      <p class="user-bar"><span id="userName"></span> <button type="button" id="logout" class="secondary">Log out</button></p>
    </div>
  </header>

  <!-- Menu on the left, page content on the right -->
  <div class="layout">
    <nav><a href="index.html" id="nav-dashboard">Dashboard</a><a href="report.html" id="nav-report">Fly-Tech report</a><a href="support.html" id="nav-support" class="active">Support</a><a href="drop.html" id="nav-simulator">Robobin simulator</a><a href="settings.html" id="nav-settings">Settings</a></nav>

  <main class="two-col">
    <section>
      <h2>Contact BinWise support</h2>
      <form id="supportForm" novalidate>
        <div class="form-group">
          <label for="supportBin">Bin</label>
          <select id="supportBin"><option value="">Choose a bin</option></select>
          <span class="error-message">Choose a bin.</span>
        </div>
        <div class="form-group">
          <label for="component">Part</label>
          <select id="component">
            <option value="">Choose a part</option>
            <option>Barcode scanner</option><option>Camera</option><option>Material sensor</option>
            <option>Liquid sensor</option><option>Screen</option><option>Other</option>
          </select>
          <span class="error-message">Choose the part with the problem.</span>
        </div>
        <div class="form-group">
          <label for="urgency">Urgency</label>
          <select id="urgency"><option>Low</option><option selected>Medium</option><option>High</option></select>
        </div>
        <div class="form-group">
          <label for="issue">What is wrong?</label>
          <textarea id="issue" rows="4" maxlength="500" placeholder="e.g. The camera shows an error and every item goes to general waste."></textarea>
          <span class="error-message">Describe the problem in at least 10 characters.</span>
        </div>
        <button type="submit">Send to BinWise</button>
        <p id="supportResult" class="note"></p>
      </form>
    </section>

    <section>
      <h2>Support requests</h2>
      <ul id="ticketList" class="tickets"><li class="note">Loading...</li></ul>
    </section>
  </main>
  </div>
</body>
</html>
